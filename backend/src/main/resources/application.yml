server:
  port: 8080

spring:
  application:
    name: helpdesk-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/helpdesk_db}
    username: ${SPRING_DATASOURCE_USERNAME:helpdesk_user}
    password: ${SPRING_DATASOURCE_PASSWORD:helpdesk_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: always

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

logging:
  level:
    root: INFO
    com.helpdesk: DEBUG

---
# Local profile for standalone testing with H2 database if Postgres is not running
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:helpdesk_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
